name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Falha só com erros; os avisos restantes estão listados em docs/lint-debt.md.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit
