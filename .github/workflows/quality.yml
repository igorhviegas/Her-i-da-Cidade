name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas pelo SHA do commit (o comentário diz a versão); o Dependabot atualiza os dois.
jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Falha só com erros; os avisos restantes estão listados em docs/lint-debt.md.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

  # Regras do Firestore no emulador (npm run test:rules): uma regressão em firestore.rules não entra sem aviso.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # O emulador do Firestore exige Java 21+.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Firestore rules tests
        run: bun run test:rules

  # Falha com vulnerabilidade alta ou crítica nas dependências (moderadas só aparecem no log).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, negação de serviço por padrões de chaves aninhados): único caminho é
      # tailwindcss > micromatch > braces, uma devDependency que só roda no build com os globs do nosso próprio
      # `tailwind.config.js` (nenhuma entrada de usuário). Não existe versão corrigida publicada (3.0.3 é a última).
      # Reavaliar ao migrar para o Tailwind v4 (não usa micromatch) ou quando houver braces corrigido.
      - name: Audit
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm
